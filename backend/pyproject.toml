[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "petri-net-sim"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "petri-modeling-skills==0.1.0",
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.40.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=1.0.0,<1.4.0",
    # LangGraph
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    # Streaming
    "sse-starlette>=2.0.0",
    # Utilities
    "tiktoken>=0.7.0",
    "tenacity>=8.2.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "email-validator>=2.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.6",
    # MCP (Model Context Protocol)
    "mcp>=1.6.0",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
    "ignore::pytest.PytestCacheWarning",
]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    ".venvm/*",
    "**/__pycache__/*",
    "setup.py",
    "conftest.py",
    "mcp_server.py",
    "main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "jproperties==2.1.2",
    "pip-audit>=2.10.0",
    "pysonar==1.5.0.4793",
    "tomli==2.4.1",
]

[tool.uv.sources]
petri-modeling-skills = { path = "vendor/petri-modeling-skills" }
