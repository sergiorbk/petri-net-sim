# TEMPLATE. Do not apply this file with real values committed into it.
#
# Create the Secret from the command line instead (see README.md), or from
# your secret manager: External Secrets, Sealed Secrets, SOPS, whichever this
# cluster already uses.
#
# The backend refuses to start without AUTH_JWT_SECRET_KEY and
# CREDENTIALS_MASTER_KEY in a deployed environment. That refusal is
# deliberate: a generated pair differs per pod, which logs users out and
# makes stored BYOK credentials unreadable.
apiVersion: v1
kind: Secret
metadata:
  name: petri-net-sim
  namespace: petri-net-sim
type: Opaque
stringData:
  # openssl rand -hex 32
  AUTH_JWT_SECRET_KEY: "REPLACE_ME"
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  CREDENTIALS_MASTER_KEY: "REPLACE_ME"

  # The managed database this deployment talks to.
  DB_HOST: "REPLACE_ME"
  DB_NAME: "petri_net_sim"
  DB_USER: "petri_net_sim"
  DB_PASSWORD: "REPLACE_ME"

  # Optional. Left empty, the login screen simply does not offer Google.
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
